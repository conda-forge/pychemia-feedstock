schema_version: 1

context:
  name: pychemia
  version: "0.24.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 29237b04c2433b4847519ab44a83511537cf24e44b21c5e8ad4ceb981bb6aa70
  patches:
    - importlib.patch
    - readme.patch

build:
  number: 3
  skip: match(python, ">3.11")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - cython
    - pip
    - python
    - setuptools
  run:
    - matplotlib-base >=3.0
    - numpy >=1.17
    - psutil >=5.6
    - pymongo >=3.9
    - python
    - netcdf4
    - scipy >=1.3
    - spglib >=1.9

tests:
  - python:
      imports:
        - pychemia
        - pychemia.analysis
      pip_check: true

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Python Framework for Materials Discovery and Design
  description: |
    PyChemia is an open-source Python Library for materials structural
    search. The purpose of the initiative is to create a method agnostic
    framework for materials discovery and design using a variety of
    methods from Minima Hoping to Soft-computing based methods. PyChemia
    is also a library for data-mining, using several methods to discover
    interesting candidates among the materials already processed.
  homepage: https://materialsdiscovery.github.io/PyChemia
  repository: https://github.com/materialsdiscovery/PyChemia
  documentation: https://materialsdiscovery.github.io/PyChemia

extra:
  recipe-maintainers:
    - jan-janssen
    - guilleaf
